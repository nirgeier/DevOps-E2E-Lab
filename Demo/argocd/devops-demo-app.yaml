apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devops-demo
spec:
  project: default
  source:
    repoURL: "https://github.com/your-org/devops-demo"
    path: helm
    targetRevision: HEAD
  destination:
    server: "https://kubernetes.default.svc"
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
